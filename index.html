<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer之路 - 求职投递记录</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1>Offer之路</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-settings" id="settingsBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
                <button class="btn btn-secondary" id="exportBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    导出报告
                </button>
                <button class="btn btn-primary" id="addBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    新增投递
                </button>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-value" id="totalCount">0</span>
                <span class="stat-label">总投递</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="testingCount">0</span>
                <span class="stat-label">笔试中</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="interviewCount">0</span>
                <span class="stat-label">面试中</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="rejectedCount">0</span>
                <span class="stat-label">挂了</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="waitingCount">0</span>
                <span class="stat-label">等offer</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="offerCount">0</span>
                <span class="stat-label">Offer</span>
            </div>
        </div>

        <div class="filter-bar">
            <div class="filter-left">
                <select id="statusFilter" class="filter-select">
                    <option value="all">全部状态</option>
                    <option value="未投递">未投递</option>
                    <option value="已投递">已投递</option>
                    <option value="笔试中">笔试中</option>
                    <option value="面试中">面试中</option>
                    <option value="挂了">挂了</option>
                    <option value="等offer">等offer</option>
                    <option value="收到offer">收到offer</option>
                </select>
                <input type="text" id="searchInput" class="search-input" placeholder="搜索公司名或城市...">
            </div>
        </div>

        <main class="main-content">
            <div id="recordsList" class="records-list">
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <p>暂无投递记录</p>
                    <p class="empty-hint">点击右上角「新增投递」开始记录</p>
                </div>
            </div>
        </main>
    </div>

    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">新增投递记录</h2>
                <button class="modal-close" id="modalClose">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <form id="recordForm" class="modal-form">
                <div class="form-group">
                    <label for="company">公司名</label>
                    <input type="text" id="company" required placeholder="请输入公司名称">
                </div>
                <div class="form-group">
                    <label for="position">岗位</label>
                    <input type="text" id="position" placeholder="请输入岗位名称">
                </div>
                <div class="form-group">
                    <label for="city">城市</label>
                    <input type="text" id="city" placeholder="请输入工作城市">
                </div>
                <div class="form-group">
                    <label for="link">投递链接</label>
                    <input type="url" id="link" placeholder="请输入投递链接（可选）">
                </div>
                <div class="form-group">
                    <label for="status">投递状态</label>
                    <select id="status" required>
                        <option value="未投递">未投递</option>
                        <option value="已投递">已投递</option>
                        <option value="笔试中">笔试中</option>
                        <option value="面试中">面试中</option>
                        <option value="挂了">挂了</option>
                        <option value="等offer">等offer</option>
                        <option value="收到offer">收到offer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="remark">备注</label>
                    <textarea id="remark" rows="3" placeholder="请输入备注信息（可选）"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2>设置</h2>
                <button class="modal-close" id="settingsClose">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <form id="settingsForm" class="modal-form">
                <div class="form-group">
                    <label for="defaultPosition">默认岗位</label>
                    <input type="text" id="defaultPosition" placeholder="设置默认岗位名称">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="settingsCancel">取消</button>
                    <button type="submit" class="btn btn-primary">保存设置</button>
                </div>
            </form>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay hidden">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2>确认删除</h2>
                <button class="modal-close" id="confirmClose">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="confirm-content">
                <p>确定要删除这条投递记录吗？</p>
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" id="confirmCancel">取消</button>
                <button class="btn btn-danger" id="confirmDelete">删除</button>
            </div>
        </div>
    </div>

    <div id="exportModal" class="modal-overlay hidden">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2>导出报告</h2>
                <button class="modal-close" id="exportClose">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-form">
                <div class="form-group">
                    <label for="exportFormat">导出格式</label>
                    <select id="exportFormat" class="filter-select">
                        <option value="md">Markdown</option>
                        <option value="txt">TXT 文本</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" id="exportCancel">取消</button>
                    <button class="btn btn-primary" id="exportConfirm">导出</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
